<style>
/* Apple-style: system font, size-specific tracking, translucent chrome, instant press feedback,
   1:1 swipe between periods with springs and rubber-banding. */
:root {
  /* motion tokens (Emil Kowalski): strong ease-out for UI, iOS drawer curve */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #8e8e93);
  --sub: var(--tg-theme-subtitle-text-color, var(--tg-theme-hint-color, #6d6d72));
  --accent: var(--tg-theme-button-color, #007aff);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-accent-text-color, var(--tg-theme-link-color, #007aff));
  --sep: var(--tg-theme-section-separator-color, rgba(60, 60, 67, .18));
  --good: #248a3d;
  --bad: #c93400;
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .2);
  --r: 16px;
  --top-pad: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not(.tg) { --bg: #000; --card: #1c1c1e; --text: #fff; --hint: #8e8e93; --sub: #98989f; --sep: rgba(84, 84, 88, .6); }
}
.dark { --good: #30d158; --bad: #ff9f0a; --fill: rgba(120, 120, 128, .24); --fill-2: rgba(120, 120, 128, .32); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 100%/1.4 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 0.9375rem; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
  padding-bottom: calc(2rem + var(--tg-content-safe-area-inset-bottom, 0px) + var(--tg-safe-area-inset-bottom, 0px));
  overflow-x: hidden; overscroll-behavior-x: none;
}
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* Feedback on press, instantly */
.press { transition: transform 160ms var(--ease-out), opacity 160ms var(--ease-out); }
.press:active { transform: scale(.97); opacity: .85; transition-duration: 60ms; }
/* big surfaces move less when pressed */
.scard.press:active, .kpi.press:active, .nv.press:active, .dg .press:active { transform: scale(.985); }

/* ---- floating translucent chrome; content scrolls underneath */
.top {
  position: sticky; top: 0; z-index: 10;
  padding: calc(.625rem + var(--top-pad)) 0 .625rem;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
/* scroll edge effect instead of a hard divider — only once content is underneath */
.top::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px; pointer-events: none;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 70%, transparent), transparent);
  opacity: 0; transition: opacity 200ms ease;
}
.scrolled .top::after { opacity: 1; }
.tabs { display: flex; gap: .375rem; overflow-x: auto; padding: 0 1rem; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: .4375rem .875rem; border-radius: 999px; background: var(--fill); font-size: .875rem; font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }

/* segmented control with a sliding thumb */
.seg { position: relative; display: flex; margin: .5rem 1rem 0; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / 5); border-radius: 7px; background: var(--card);
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); transition: transform 250ms var(--ease-out); }
.dark .seg .thumb { background: #636366; }
.seg button { position: relative; flex: 1; padding: .375rem 0; font-size: .8125rem; font-weight: 500; color: var(--text); }
.seg button.on { font-weight: 600; }

/* ---- large title */
.head { display: flex; align-items: flex-end; gap: .5rem; padding: .875rem 1rem .75rem; }
.head .t { flex: 1; min-width: 0; }
.ttl { font-size: 2.125rem; line-height: 1.08; font-weight: 700; letter-spacing: -0.022em; }
.per { color: var(--sub); font-size: .9375rem; margin-top: .125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.nav { flex: none; width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--fill); color: var(--link); display: grid; place-items: center; }
.nav svg { width: 14px; height: 14px; }
.nav:disabled { opacity: .3; pointer-events: none; }
.now { display: inline-block; margin-top: .25rem; font-size: .9375rem; color: var(--link); font-weight: 500; }
.now[hidden] { display: none; }

/* ---- swipeable content pane */
.viewport { overflow: hidden; touch-action: pan-y; }
.pane { padding: 0 1rem; will-change: transform; }
.pane.busy { opacity: .6; transition: opacity 200ms ease 150ms; }
.fade-in { animation: fadein 220ms ease-out both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ---- KPI cards */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: .625rem; }
.kpi { background: var(--card); border-radius: var(--r); padding: .75rem .875rem .8125rem; min-width: 0; }
.kpi.wide, .kpi.hero { grid-column: 1 / -1; }
.kpi.hero { padding: 1rem 1rem 1.0625rem; }
.kpi .l { color: var(--sub); font-size: .8125rem; font-weight: 500; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 1.375rem; line-height: 1.15; font-weight: 700; margin-top: .25rem; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hero .v { font-size: 2.5rem; line-height: 1.05; letter-spacing: -0.03em; }
.kpi .m { display: flex; align-items: center; gap: .375rem; margin-top: .375rem; min-height: 1.125rem; font-size: .75rem; color: var(--hint); letter-spacing: .005em; }
.kpi .m span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl { flex: none; padding: .0625rem .375rem; border-radius: 6px; font-weight: 600; font-size: .75rem; background: var(--fill); color: var(--sub); font-variant-numeric: tabular-nums; }
.dl.g { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.dl.b { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }

/* numbers big, units small */
.v .u, .sv .u { font-size: .58em; font-weight: 600; letter-spacing: 0; color: var(--sub); }

/* ---- Health-style summary */
.sum { display: grid; gap: .625rem; }
.scard { display: block; width: 100%; text-align: left; background: var(--card); border-radius: var(--r); padding: .75rem .875rem .875rem; }
.sh { display: flex; justify-content: space-between; align-items: center; }
.sn { color: var(--c); font-weight: 600; font-size: .9375rem; letter-spacing: -0.01em; }
.chev { width: 7px; height: 7px; border: solid var(--hint); border-width: 0 2px 2px 0; transform: rotate(-45deg); margin-right: 4px; }
.srow { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem; margin-top: .5rem; }
.sl { min-width: 0; }
.sv { font-size: 1.75rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ss { display: flex; align-items: center; gap: .375rem; margin-top: .25rem; font-size: .8125rem; color: var(--sub); min-width: 0; }
.ss span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
svg.spark { flex: none; width: 76px; height: 38px; color: var(--text); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: .375rem .75rem; margin-top: .625rem; font-size: .8125rem; }
.lg { display: flex; align-items: center; gap: .375rem; min-width: 0; }
.lg .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.lg .ln { color: var(--sub); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg b { font-weight: 600; font-variant-numeric: tabular-nums; }
svg.hyp { height: 150px; cursor: default; }

/* ---- chart */
.card { background: var(--card); border-radius: var(--r); padding: .875rem .875rem .75rem; margin-top: .625rem; }
.chead { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.cname { font-weight: 600; font-size: .9375rem; letter-spacing: -0.01em; }
.cavg { color: var(--hint); font-size: .75rem; white-space: nowrap; }
.tip { margin-top: .375rem; font-size: .8125rem; color: var(--sub); min-height: 1.125rem; font-variant-numeric: tabular-nums; }
.tip b { color: var(--text); font-weight: 600; }
svg.ch { display: block; width: 100%; height: 160px; margin-top: .5rem; touch-action: pan-y; cursor: crosshair; }
svg.ch text { fill: var(--hint); font-size: 10px; font-family: inherit; letter-spacing: .01em; }
svg.ch path, svg.ch rect.bar { transition: fill-opacity 120ms ease; }

/* ---- detail blocks */
.blocks h3 { margin: 1.375rem .25rem .375rem; font-size: .8125rem; font-weight: 400; color: var(--sub); text-transform: uppercase; letter-spacing: .02em; }
.blocks p { margin: .625rem 0; background: var(--card); border-radius: var(--r); padding: .75rem .875rem; }
.tw { background: var(--card); border-radius: var(--r); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; font-variant-numeric: tabular-nums; }
td, th { padding: .625rem .875rem; text-align: left; white-space: nowrap; }
th { color: var(--hint); font-weight: 500; font-size: .75rem; padding-top: .6875rem; padding-bottom: .375rem; letter-spacing: .01em; }
tr + tr td { box-shadow: inset 0 .5px 0 var(--sep); }
td.r, th.r { text-align: right; }
td:first-child { white-space: normal; min-width: 5.5rem; }
details { background: var(--card); border-radius: var(--r); margin-top: .625rem; overflow: hidden; }
summary { list-style: none; padding: .8125rem .875rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
summary:active { background: var(--fill); }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 7px; height: 7px; border: solid var(--hint); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform 200ms var(--ease-out); margin-right: 4px; }
details[open] summary::after { transform: rotate(45deg); }
details .tw, details p { border-radius: 0; margin: 0; box-shadow: inset 0 .5px 0 var(--sep); }
details h3 { margin: .75rem .875rem .25rem; }

.rt { background: var(--card); border-radius: var(--r); margin-top: .625rem; overflow: hidden; }
.rt h4 { margin: 0; padding: .8125rem .875rem .25rem; font-size: .9375rem; font-weight: 600; letter-spacing: -0.01em; }
.rti { display: flex; gap: .75rem; align-items: flex-start; padding: .6875rem .875rem; }
.rti + .rti { box-shadow: inset 0 .5px 0 var(--sep); }
.rti.off { opacity: .55; }
.rti .ic { flex: none; width: 2rem; height: 2rem; border-radius: 9px; display: grid; place-items: center; font-size: 1rem; background: color-mix(in srgb, #AF52DE 14%, transparent); }
.rti .tx { flex: 1; min-width: 0; }
.rti .tt { font-weight: 600; font-size: .9375rem; letter-spacing: -0.01em; }
.rti .wh { font-size: .8125rem; color: var(--sub); margin-top: .125rem; }
.rti .rs { font-size: .75rem; color: var(--hint); margin-top: .25rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rti .bt { flex: none; display: flex; gap: .375rem; }
.rti .bt button { width: 2rem; height: 2rem; border-radius: 50%; background: var(--fill); color: var(--text); display: grid; place-items: center; }
.rti .bt button svg { width: 14px; height: 14px; }
.rti .bt button:disabled { opacity: .4; }
.rt .hint { padding: .25rem .875rem .8125rem; font-size: .75rem; color: var(--hint); line-height: 1.45; }
.empty { background: var(--card); border-radius: var(--r); padding: 1.5rem 1rem; text-align: center; color: var(--sub); line-height: 1.45; }
.notice { display: flex; gap: .5rem; align-items: flex-start; margin-bottom: .625rem; padding: .625rem .875rem; border-radius: 12px; font-size: .8125rem; line-height: 1.4; color: var(--sub); background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
.notice::before { content: "ℹ︎"; flex: none; color: var(--link); font-weight: 700; }
.kpi.tap { cursor: pointer; position: relative; }
.kpi.tap::after { content: ""; position: absolute; top: .9rem; right: .875rem; width: 6px; height: 6px; border: solid var(--hint); border-width: 0 1.8px 1.8px 0; transform: rotate(-45deg); opacity: .7; }
.grid.tiles { grid-template-columns: repeat(auto-fit, minmax(4.5rem, 1fr)); gap: .5rem; }
.grid.tiles .kpi { padding: .625rem .625rem .6875rem; }
.grid.tiles .kpi .l { font-size: .75rem; }
.grid.tiles .kpi .v { font-size: 1.375rem; }
.grid.tiles .kpi .m { min-height: 0; margin-top: .125rem; }
.grid.tiles .kpi.tap::after { display: none; }

/* ---- native-style lists */
.ls { background: var(--card); border-radius: var(--r); margin-top: .625rem; overflow: hidden; }
.ls h4 { margin: 0; padding: .75rem .875rem .375rem; font-size: .8125rem; font-weight: 600; color: var(--sub); letter-spacing: .005em; }
.ls h4 + .li { box-shadow: none; }
.li { display: flex; gap: .625rem; align-items: center; padding: .625rem .875rem; box-shadow: inset 0 .5px 0 var(--sep); min-height: 2.75rem; }
.li .tm { flex: none; width: 3.25rem; font-size: .8125rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.25; }
.li .tm small { display: block; font-weight: 400; color: var(--hint); font-size: .6875rem; }
.li .ic2 { flex: none; font-size: 1rem; }
.li .tx { flex: 1; min-width: 0; }
.li .tt { font-size: .9375rem; line-height: 1.3; letter-spacing: -0.005em; }
.li.done .tt { color: var(--hint); text-decoration: line-through; }
.li .sb2 { font-size: .75rem; color: var(--hint); margin-top: .0625rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .pr { color: var(--bad); font-weight: 700; margin-left: .25rem; }
.ls .more { display: block; width: 100%; text-align: left; padding: .6875rem .875rem; color: var(--link); font-weight: 500; font-size: .875rem; box-shadow: inset 0 .5px 0 var(--sep); }
.nv { display: flex; width: 100%; align-items: center; justify-content: space-between; text-align: left; background: var(--card); border-radius: var(--r); margin-top: .625rem; padding: .8125rem .875rem; font-weight: 500; }
.nv .chev { flex: none; }
.nv .cnt { margin-left: auto; margin-right: .625rem; color: var(--hint); font-weight: 400; }

/* ---- bottom sheet */
.sw { position: fixed; inset: 0; z-index: 50; }
.sw[hidden] { display: none; }
.sbk { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); opacity: 0; }
.sp { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--top-pad) - 3rem); display: flex; flex-direction: column;
  background: var(--bg); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .25); will-change: transform; }
.sgr { flex: none; padding: .5rem 0 .25rem; touch-action: none; cursor: grab; }
.sgr::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; margin: 0 auto; background: var(--fill-2); }
.shd { flex: none; display: flex; align-items: center; gap: .5rem; padding: .25rem 1rem .5rem; touch-action: none; }
.shd .stt { flex: 1; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
.shd button { color: var(--link); font-weight: 600; font-size: .9375rem; }
.sc { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 1rem calc(1.25rem + var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)); }
.sc > .ls:first-child, .sc > .blocks > :first-child { margin-top: 0; }
.sc details { margin-top: .625rem; }
.qa { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .625rem; }
.qa button { display: flex; align-items: center; justify-content: center; gap: .375rem; padding: .6875rem .5rem; border-radius: 12px; background: var(--card); font-weight: 600; font-size: .875rem; color: var(--link); }
.li.tap { cursor: pointer; }
.btns { display: grid; gap: .5rem; margin-top: .75rem; }
.btn { display: block; width: 100%; padding: .8125rem; border-radius: 12px; background: var(--card); font-weight: 600; font-size: .9375rem; text-align: center; color: var(--link); }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; }
.chips { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .5rem; }
.chips button { padding: .5rem .75rem; border-radius: 999px; background: var(--card); font-size: .875rem; font-weight: 500; }
.lbl { margin: 1rem .25rem .25rem; font-size: .75rem; color: var(--hint); text-transform: uppercase; letter-spacing: .03em; }
.info { background: var(--card); border-radius: var(--r); padding: .75rem .875rem; font-size: .875rem; line-height: 1.45; color: var(--sub); }
.info b { color: var(--text); font-weight: 600; }
input.dt, textarea.ask { width: 100%; font: inherit; color: var(--text); background: var(--card); border: 0; border-radius: 12px; padding: .75rem .875rem; outline: none; -webkit-user-select: text; user-select: text; }
textarea.ask { min-height: 5.5rem; resize: none; line-height: 1.4; }
.askrow { display: flex; gap: .5rem; margin-top: .5rem; }
.askrow .btn { flex: 1; }
.mic { flex: none; width: 3rem; border-radius: 12px; background: var(--card); color: var(--link); display: grid; place-items: center; }
.mic svg { width: 18px; height: 18px; }
.mic.rec { background: var(--bad); color: #fff; animation: pulse 1.2s infinite ease-in-out; }
.reply { margin-top: .75rem; background: var(--card); border-radius: var(--r); padding: .75rem .875rem; font-size: .9375rem; line-height: 1.45; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
.reply .heard { display: block; color: var(--hint); font-size: .8125rem; margin-bottom: .375rem; }
.reply .note { display: block; margin-top: .5rem; color: var(--bad); }
.bud { padding: .625rem .875rem .75rem; box-shadow: inset 0 .5px 0 var(--sep); }
.ls h4 + .bud { box-shadow: none; }
.bud .bh { display: flex; justify-content: space-between; gap: .5rem; font-size: .875rem; }
.bud .bh b { font-weight: 600; }
.bud .bs { font-size: .75rem; color: var(--hint); margin-top: .125rem; }
.bar { height: 6px; border-radius: 3px; background: var(--fill); margin-top: .4375rem; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--good); transform-origin: 0 50%; }
.bar i.warn { background: #ff9f0a; } .bar i.over { background: #ff3b30; }
.grow-x { animation: growx 400ms var(--ease-out) both; }
@keyframes growx { from { transform: scaleX(0); } }
.sub .soon { color: var(--bad); }
.li.sub .tm { width: auto; max-width: 45%; text-align: right; font-size: .8125rem; }
.foot { margin-top: 1.25rem; text-align: center; font-size: .75rem; color: var(--hint); line-height: 1.6; letter-spacing: .005em; padding: 0 1rem; }
.foot .np { color: var(--sub); font-size: .8125rem; }
.live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; }
.live.off { background: var(--hint); }

.sk { background: var(--card); border-radius: var(--r); height: 5.25rem; animation: pulse 1.2s infinite ease-in-out; }

/* ---- AI digest */
.dg { background: var(--card); border-radius: var(--r); margin-bottom: .625rem; overflow: hidden; }
.dgh { display: flex; align-items: center; gap: .5rem; padding: .8125rem .875rem .25rem; }
.dgh .k { flex: 1; min-width: 0; font-weight: 600; font-size: .9375rem; letter-spacing: -0.01em; }
.dgh .at { color: var(--hint); font-size: .75rem; font-weight: 400; margin-left: .25rem; }
.mini { display: flex; padding: 2px; border-radius: 8px; background: var(--fill); }
.mini button { padding: .1875rem .5625rem; border-radius: 6px; font-size: .75rem; font-weight: 500; color: var(--sub); }
.mini button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.dark .mini button.on { background: #636366; }
.rf { flex: none; width: 1.875rem; height: 1.875rem; border-radius: 50%; background: var(--fill); color: var(--link); display: grid; place-items: center; }
.rf svg { width: 14px; height: 14px; }
.rf.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

    var wait = card.querySelector('.dge button'); if (wait) { wait.disabled = true; wait.textContent = 'Думаю…'; }
    fetch('/api/digest?k=' + kind, { method: 'POST', headers: { Authorization: 'tma ' + initData } }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; });
    }).then(function (j) {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      dg[kind] = j.digest; digestKind = kind;
      if (data && data.digests) data.digests = dg;
      swapCard(card, dg);
    }).catch(function (e) {
      btn.classList.remove('spin'); if (wait) { wait.disabled = false; wait.textContent = 'Сделать разбор'; }
      if (tg && tg.showAlert) tg.showAlert(e.message); else alert(e.message);
    });
  }

  function summaryList(items) {
    var wrap = el('div', 'sum');
    items.forEach(function (it) {
      var c = el('button', 'scard press');
      c.style.setProperty('--c', it.color);
      var h = el('div', 'sh');
      h.appendChild(el('span', 'sn', it.icon + ' ' + it.name));
      h.appendChild(el('span', 'chev'));
      c.appendChild(h);
      var row = el('div', 'srow'), left = el('div', 'sl');
      left.appendChild(valueEl(it.value, 'sv'));
      var sub = el('div', 'ss');
      if (it.delta != null && Number.isFinite(it.delta)) {
        var flat = Math.abs(it.delta) < 0.005;
        sub.appendChild(el('span', 'dl' + (it.good == null || flat ? '' : ((it.delta > 0) === it.good ? ' g' : ' b')), deltaText(it.delta)));
      }
      if (it.sub) sub.appendChild(el('span', '', it.sub));
      left.appendChild(sub);
      row.appendChild(left);
      row.appendChild(spark(it.spark, it.color));
      c.appendChild(row);
      c.onclick = function () { go({ s: it.s }); };
      wrap.appendChild(c);
    });
    return wrap;
  }

  function spark(y, color) {
    var W = 76, H = 38, n = Math.max(1, y.length), max = Math.max.apply(null, y.concat([1])), step = W / n, bw = Math.max(2, step * 0.62);
    var svg = sv('svg', { 'class': 'spark', viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    for (var i = 0; i < y.length; i++) {
      var h = y[i] > 0 ? Math.max(3, (H - 2) * y[i] / max) : 2;
      var r = sv('rect', { x: i * step + (step - bw) / 2, y: H - h, width: bw, height: h, rx: Math.min(2, bw / 2), fill: y[i] > 0 ? color : 'currentColor', 'fill-opacity': y[i] > 0 ? (i === y.length - 1 ? 1 : 0.45) : 0.12 });
      if (anim === true) { r.classList.add('grow'); r.style.animationDelay = (120 + i * 16) + 'ms'; }
      svg.appendChild(r);
    }
    return svg;
  }

  var SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs) { var e = document.createElementNS(SVGNS, tag); for (var a in attrs) e.setAttribute(a, attrs[a]); return e; }

  function chartCard(c, color) {
    var card = el('div', 'card');
    var head = el('div', 'chead');
    head.appendChild(el('div', 'cname', c.name));
    if (c.avg) head.appendChild(el('div', 'cavg', 'в среднем ' + c.avg));
    card.appendChild(head);
    var svg = sv('svg', { 'class': 'ch', role: 'img', 'aria-label': c.name });
    card.appendChild(svg);
    var tip = el('div', 'tip');
    card.appendChild(tip);
    var legend = null;
    if (c.stack) {
      legend = el('div', 'legend');
      card.appendChild(legend);
    }
    var a = anim;
    if (a === 'soft') svg.classList.add('reveal');
    requestAnimationFrame(function () { drawChart(svg, tip, c, color || '#007AFF', legend, a); });
    return card;
  }

  function capsule(x, y1, y2, w, fill, op) {
    var h = Math.max(w, y2 - y1), r = w / 2;
    return sv('rect', { x: x, y: y2 - h, width: w, height: h, rx: r, fill: fill, 'fill-opacity': op == null ? 1 : op });
  }

  function drawChart(svg, tip, c, color, legend, a) {
    var W = svg.clientWidth || 320, H = 160, top = 16, bottom = 18, plotH = H - top - bottom;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.textContent = '';
    var cs = getComputedStyle(document.documentElement);
    var n = c.y.length, step = W / n, gap = Math.max(1, Math.min(4, step * 0.22)), bw = Math.max(1, step - gap);
    var base = top + plotH, i, j;
    var range = !!(c.lo && c.hiv), stack = !!c.stack;
    var lo = 0, max;
    if (range) {
      var vals = c.lo.concat(c.hiv).filter(function (v) { return v > 0; });
      lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 8) / 10) * 10); max = Math.ceil((Math.max.apply(null, vals) + 5) / 10) * 10;
    } else if (stack) max = Math.max.apply(null, c.stack.map(function (s) { return s[0] + s[1] + s[2] + s[3]; })) || 1;
    else max = Math.max.apply(null, c.y) || 1;
    var Y = function (v) { return base - plotH * (v - lo) / (max - lo || 1); };
    svg.appendChild(sv('line', { x1: 0, x2: W, y1: base + .5, y2: base + .5, stroke: 'currentColor', 'stroke-opacity': .15 }));
    var groups = [];
    for (i = 0; i < n; i++) {
      var g = sv('g', {}), x = i * step + gap / 2;
      if (range) {
        if (c.hiv[i] > 0) {
          var w = Math.min(bw, 9), cx = x + (bw - w) / 2;
          g.appendChild(capsule(cx, Y(c.hiv[i]), Y(c.lo[i] || c.y[i]), w, color));
          g.appendChild(sv('circle', { cx: cx + w / 2, cy: Y(c.y[i]), r: Math.min(3, w / 2 - 0.5), fill: 'var(--card)' }));
        }
      } else if (stack) {
        var acc = 0, s = c.stack[i];
        for (j = 0; j < 4; j++) {
          if (!s[j]) continue;
          var y0 = Y(acc), y1 = Y(acc + s[j]); acc += s[j];
          g.appendChild(sv('rect', { x: x, y: y1, width: bw, height: Math.max(1, y0 - y1 - (acc > s[j] ? 1 : 0)), rx: Math.min(2, bw / 3), fill: STAGES[j][2] }));
        }
        if (!acc) g.appendChild(sv('rect', { x: x, y: base - 2, width: bw, height: 2, rx: 1, fill: 'currentColor', 'fill-opacity': .12 }));
      } else {
        var v = c.y[i], h = v > 0 ? Math.max(2, plotH * v / max) : 0;
        if (h > 0) {
          var rr = Math.min(4, bw / 2, h), yy = base - h;
          g.appendChild(sv('path', { d: 'M' + x + ',' + base + 'V' + (yy + rr) + 'Q' + x + ',' + yy + ' ' + (x + rr) + ',' + yy + 'H' + (x + bw - rr) + 'Q' + (x + bw) + ',' + yy + ' ' + (x + bw) + ',' + (yy + rr) + 'V' + base + 'Z', fill: color }));
        } else g.appendChild(sv('rect', { x: x, y: base - 2, width: bw, height: 2, rx: 1, fill: 'currentColor', 'fill-opacity': .12 }));
      }
      if (a === true) { g.classList.add('grow'); g.style.animationDelay = Math.round(i * Math.min(16, 240 / n)) + 'ms'; }
      groups.push(g); svg.appendChild(g);
    }
    if (c.avgY && !stack) {
      var ay = Y(c.avgY);
      svg.appendChild(sv('line', { x1: 0, x2: W, y1: ay, y2: ay, stroke: 'currentColor', 'stroke-opacity': .35, 'stroke-dasharray': '3 3' }));
    }
    var ml = sv('text', { x: W - 2, y: 1, 'text-anchor': 'end', 'dominant-baseline': 'hanging' }); ml.textContent = stack ? Math.round(max) + ' ч' : fmtAxis(max); svg.appendChild(ml);
    if (range) { var ll = sv('text', { x: W - 2, y: base - 3, 'text-anchor': 'end' }); ll.textContent = String(lo); svg.appendChild(ll); }
    var every = Math.ceil(n / Math.max(2, Math.floor(W / 44)));
    for (j = 0; j < n; j += every) { var t = sv('text', { x: j * step + step / 2, y: H - 3, 'text-anchor': 'middle' }); t.textContent = c.x[j]; svg.appendChild(t); }
    svg.style.color = cs.getPropertyValue('--text');
    var has = function (k) { return stack ? c.stack[k].some(function (v) { return v > 0; }) : range ? c.hiv[k] > 0 : c.y[k] > 0; };
    var last = n - 1; while (last > 0 && !has(last)) last--;
    var active = selected >= 0 && selected < n ? selected : c.hi >= 0 && has(c.hi) ? c.hi : last;
    function pick(k) {
      if (k < 0 || k >= n) return;
      active = k;
      groups.forEach(function (gg, m) { gg.setAttribute('opacity', m === k ? 1 : .45); });
      tip.textContent = '';
      tip.appendChild(document.createTextNode(c.d[k] + ' · '));
      if (range && c.hiv[k] > 0) tip.appendChild(el('b', '', (c.lo[k] && c.lo[k] < c.y[k] ? c.lo[k] + '–' : 'средний ' + Math.round(c.y[k]) + ', макс ') + c.hiv[k] + ' уд/мин'));
      else tip.appendChild(el('b', '', c.f[k]));
      if (legend) {
        legend.textContent = '';
        STAGES.forEach(function (st, si) {
          var it = el('div', 'lg');
          var dot = el('span', 'dot'); dot.style.background = st[2]; it.appendChild(dot);
          it.appendChild(el('span', 'ln', st[1]));
          it.appendChild(el('b', '', c.stack[k][si] ? hmFmt(c.stack[k][si]) : '—'));
          legend.appendChild(it);
        });
      }
    }
    pick(active);
    function at(ev) {
      var rect = svg.getBoundingClientRect();
      var k = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - rect.left) / rect.width * n)));
      if (k !== active) { pick(k); selected = k; haptic(); }
    }
    svg.addEventListener('pointerdown', function (ev) { try { svg.setPointerCapture(ev.pointerId); } catch (e) {} at(ev); });
    svg.addEventListener('pointermove', function (ev) { if (ev.pointerType === 'mouse' || ev.buttons) at(ev); });
  }

  /** One night like the Health app: lanes for awake / REM / core / deep. */
  function hypCard(hy) {
    var card = el('div', 'card');
    var head = el('div', 'chead');
    head.appendChild(el('div', 'cname', 'Стадии сна'));
    head.appendChild(el('div', 'cavg', hy.start + ' – ' + hy.end));
    card.appendChild(head);
    var svg = sv('svg', { 'class': 'ch hyp', role: 'img', 'aria-label': 'Стадии сна' });
    card.appendChild(svg);
    var a = anim;
    requestAnimationFrame(function () {
      var W = svg.clientWidth || 320, H = 150, lab = 92, lanes = ['awake', 'rem', 'core', 'deep'], lh = (H - 22) / 4;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      var total = Math.max.apply(null, hy.segs.map(function (s) { return s.b; })) || 1, pw = W - lab;
      lanes.forEach(function (ln, li) {
        var st = STAGES.filter(function (s) { return s[0] === ln; })[0];
        var t = sv('text', { x: 0, y: li * lh + lh / 2 + 4 }); t.textContent = st[1]; svg.appendChild(t);
        svg.appendChild(sv('line', { x1: lab, x2: W, y1: li * lh + lh / 2, y2: li * lh + lh / 2, stroke: 'currentColor', 'stroke-opacity': .08 }));
      });
      hy.segs.forEach(function (s) {
        var li = lanes.indexOf(s.st); if (li < 0) return;
        var st = STAGES.filter(function (x) { return x[0] === s.st; })[0];
        var x = lab + pw * s.a / total, w = Math.max(3, pw * (s.b - s.a) / total);
        var r = sv('rect', { x: x, y: li * lh + 4, width: w, height: lh - 8, rx: Math.min(5, (lh - 8) / 2), fill: st[2] });
        if (a) { r.classList.add('sweep'); r.style.animationDelay = Math.round(240 * s.a / total) + 'ms'; }
        svg.appendChild(r);
      });
      var a = sv('text', { x: lab, y: H - 3 }); a.textContent = hy.start; svg.appendChild(a);
      var b = sv('text', { x: W - 2, y: H - 3, 'text-anchor': 'end' }); b.textContent = hy.end; svg.appendChild(b);
      svg.style.color = getComputedStyle(document.documentElement).getPropertyValue('--text');
    });
    return card;
  }
  function fmtAxis(v) { return v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10).replace('.', ','); }

  function inline(t, parent) {
    if (typeof t === 'string') parent.appendChild(document.createTextNode(t));
    else if (Array.isArray(t)) t.forEach(function (x) { inline(x, parent); });
    else if (t && typeof t === 'object') { var e = el(t.type === 'bold' ? 'b' : t.type === 'italic' ? 'i' : 'span'); inline(t.text, e); parent.appendChild(e); }
  }

  function textOf(t) { return typeof t === 'string' ? t : Array.isArray(t) ? t.map(textOf).join('') : t && t.text ? textOf(t.text) : ''; }
  /** On the page a details block is a row that opens a sheet; inside a sheet it is shown expanded. */
  function renderBlocks(blocks, parent, inSheet) {
    blocks.forEach(function (b) {
      if (b.type === 'details' && !inSheet) {
        var title = textOf(b.summary), m = title.match(/^(.*?)\s*\((\d+)\)\s*$/);
        var row = el('button', 'nv press');
        row.appendChild(el('span', '', m ? m[1] : title));
        if (m) row.appendChild(el('span', 'cnt', m[2]));
        row.appendChild(el('span', 'chev'));
        row.onclick = function () { openSheet(m ? m[1] : title, function (box) { var bl = el('div', 'blocks'); renderBlocks(b.blocks || [], bl, true); box.appendChild(bl); }); };
        parent.appendChild(row);
        return;
      }
      if (b.type === 'details' && inSheet) { var h0 = el('h3'); inline(b.summary, h0); parent.appendChild(h0); renderBlocks(b.blocks || [], parent, true); return; }
      if (b.type === 'heading') { var h = el('h3'); inline(b.text, h); parent.appendChild(h); }
      else if (b.type === 'paragraph') { var p = el('p'); inline(b.text, p); parent.appendChild(p); }
      else if (b.type === 'table') parent.appendChild(table(b.cells));
      else if (b.type === 'details') {
        var d = el('details'), s = el('summary'); inline(b.summary, s); d.appendChild(s);
        renderBlocks(b.blocks || [], d);
        s.addEventListener('click', function () { haptic(); });
        parent.appendChild(d);
      }
    });
  }

  function table(rows) {
    var w = el('div', 'tw'), t = el('table');
    rows.forEach(function (r) {
      var tr = el('tr');
      r.forEach(function (c) { var cell = el(c.is_header ? 'th' : 'td', c.align === 'right' ? 'r' : ''); inline(c.text, cell); tr.appendChild(cell); });
      t.appendChild(tr);
    });
    w.appendChild(t);
    return w;
  }

  function ago(iso) {
    if (!iso) return 'ещё не было';
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    return m < 1 ? 'только что' : m < 60 ? m + ' мин назад' : m < 1440 ? Math.round(m / 60) + ' ч назад' : Math.round(m / 1440) + ' дн назад';
  }

  function renderFoot() {
    var f = $('foot'); f.textContent = '';
    if (!data) return;
    var secs = data.sections, pg = el('div', 'pager');
    secs.forEach(function (s) { pg.appendChild(el('i', s[0] === state.s ? 'on' : '')); });
    if (secs.length > 1) f.appendChild(pg);
    if (data.np) f.appendChild(el('div', 'np', '▶ ' + data.np));
    var line = el('div');
    line.appendChild(el('span', 'live' + (liveOk ? '' : ' off')));
    line.appendChild(document.createTextNode('Здоровье: ' + ago(data.sync.health) + ' · Музыка: ' + ago(data.sync.music)));
    f.appendChild(line);
  }

  function showError(msg) {
    var body = $('body'); body.textContent = '';
    var box = el('div', 'empty', msg || 'Не удалось загрузить данные');
    var b = el('button', 'now press', 'Повторить'); b.onclick = function () { load(); };
    box.appendChild(el('br')); box.appendChild(b);
    body.appendChild(box);
  }

  // ---------------------------------------------------------------- live updates (long poll)
  // Long poll on the Mac; in the cloud /api/wait answers at once, so wait between checks.
  function poll() {
    if (!initData) return;
    var t0 = Date.now();
    api('/api/wait?ver=' + ver).then(function (r) {
      var was = liveOk; liveOk = true;
      if (r.ver !== ver) cache = {};
      if (r.ver !== ver && (state.o === 0 || fellBack)) { if (fellBack) state.o = 0; return load({ silent: true, keepSel: true, fb: fellBack }).then(function () { setTimeout(poll, 1000); }); }
      if (!was) renderFoot();
      setTimeout(poll, Date.now() - t0 < 3000 ? 30000 : 0);
    }).catch(function () { liveOk = false; renderFoot(); setTimeout(poll, 10000); });
  }

  // ---------------------------------------------------------------- swipe between sections (1:1, momentum, rubber-band)
  (function () {
    var vp = $('viewport'), start = null, locked = null, hist = [], swipedAt = 0;
    // A swipe that started on a card must not also open it.
    vp.addEventListener('click', function (e) { if (Date.now() - swipedAt < 350) { e.stopPropagation(); e.preventDefault(); } }, true);
    function rubberband(over, dim) { var c = 0.55; return (over * dim * c) / (dim + c * Math.abs(over)); }
    function canGo(dx) { return canSection(dx > 0 ? 1 : -1); }
    vp.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' || e.target.closest('svg.ch, .tw, summary, .mini, .rf, .bt, .dge button')) return;
      start = { x: e.clientX, y: e.clientY, id: e.pointerId, base: paneSpring.x }; // grab from the live position
      locked = null; hist = [{ x: e.clientX, t: e.timeStamp }];
    });
    vp.addEventListener('pointermove', function (e) {
      if (!start || e.pointerId !== start.id) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!locked) {
        if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // hysteresis before committing to a direction
        locked = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
        if (locked === 'y') { start = null; return; }
        try { vp.setPointerCapture(e.pointerId); } catch (err) {}
        cancelAnimationFrame(paneSpring.raf); paneSpring.raf = 0;
      }
      hist.push({ x: e.clientX, t: e.timeStamp }); if (hist.length > 6) hist.shift();
      var x = start.base + dx;
      paneSpring.x = canGo(x) ? x : rubberband(x, innerWidth);
      paneSpring.onUpdate(paneSpring.x);
    });
    function end(e) {
      if (!start || e.pointerId !== start.id) return;
      var wasX = locked === 'x'; start = null;
      if (!wasX) return;
      swipedAt = Date.now();
      var a = hist[0], b = hist[hist.length - 1], dt = Math.max(1, b.t - a.t);
      var v = (b.x - a.x) / dt * 1000; // px/s
      var projected = paneSpring.x + (v / 1000) * 0.998 / (1 - 0.998); // Apple's momentum projection
      var W = innerWidth;
      if (Math.abs(projected) > W * 0.5 && canGo(projected)) shiftSection(projected > 0 ? 1 : -1, v);
      else paneSpring.to(0, { velocity: v, damping: 0.85 });
    }
    vp.addEventListener('pointerup', end);
    vp.addEventListener('pointercancel', end);
  })();

  // ---------------------------------------------------------------- controls
  $('prev').onclick = function () { shiftPeriod(1, 0); };
  $('next').onclick = function () { if (state.o > 0) shiftPeriod(-1, 0); };
  $('now').onclick = function () { go({ o: 0 }); };
  var raf = 0;
  window.addEventListener('scroll', function () { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; document.documentElement.classList.toggle('scrolled', scrollY > 4); }); }, { passive: true });
  var rw = 0;
  window.addEventListener('resize', function () { clearTimeout(rw); rw = setTimeout(function () { if (data) render(); }, 120); });

  applyTheme();
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
    var mobile = tg.platform === 'ios' || tg.platform === 'android' || tg.platform === 'android_x';
    if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && !tg.isFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    tg.onEvent('themeChanged', function () { applyTheme(); if (data) render(); });
    tg.BackButton && tg.BackButton.onClick(function () { if (sheetOpen) closeSheet(0); else go({ o: 0 }); });
  }
  if (!initData) { renderNav(); showError('Открой дашборд из Telegram: кнопка «Статистика» у бота.'); $('ttl').textContent = 'lifestats'; $('per').textContent = ''; return; }
  load({ fb: true, fade: true }).then(poll);
  setInterval(renderFoot, 60000);
})();
